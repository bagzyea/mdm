plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'app.cash.paparazzi'
}

// ---------------------------------------------------------------------------
// Certificate pins and the server host are supplied at build time, not hardcoded
// (finding F-08), so rotating a certificate does not require a code change.
//
// Set in ~/.gradle/gradle.properties or on the command line:
//   ./gradlew assembleRelease -PmdmHost=mdm.uboscare.com \
//       -PmdmPinPrimary=sha256/... -PmdmPinBackup=sha256/...
//
// Read a pin off the live server with:
//   openssl s_client -connect HOST:443 </dev/null | openssl x509 -pubkey -noout \
//     | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | base64
// ---------------------------------------------------------------------------
def mdmHost = project.findProperty('mdmHost') ?: 'mdm.uboscare.com'
// Server for debug builds. Defaults to the emulator's alias for the host machine; for a
// real tablet on the office network build with -PmdmDevServer=http://10.10.10.241:5001.
def mdmDevServer = project.findProperty('mdmDevServer') ?: 'http://10.0.2.2:5001'
def mdmPinPrimary = project.findProperty('mdmPinPrimary') ?: ''
def mdmPinBackup = project.findProperty('mdmPinBackup') ?: ''

// ---------------------------------------------------------------------------
// Release signing (finding F-11). Release builds were unsigned — signingConfig was
// commented out — which blocks distribution and, more importantly, blocks Device
// Owner provisioning: the QR payload must carry the DPC's signature checksum, and
// an unsigned APK has none.
//
// Credentials come from properties or the environment so the keystore is never
// committed. In CI, set MDM_STORE_FILE/MDM_STORE_PASSWORD/MDM_KEY_ALIAS/
// MDM_KEY_PASSWORD from secrets. See docs/KEYSTORE_SETUP.md.
// ---------------------------------------------------------------------------
def keystoreFile = project.findProperty('mdmStoreFile') ?: System.getenv('MDM_STORE_FILE')
def keystorePassword = project.findProperty('mdmStorePassword') ?: System.getenv('MDM_STORE_PASSWORD')
def keystoreAlias = project.findProperty('mdmKeyAlias') ?: System.getenv('MDM_KEY_ALIAS')
def keystoreKeyPassword = project.findProperty('mdmKeyPassword') ?: System.getenv('MDM_KEY_PASSWORD')
def hasSigningConfig = keystoreFile && keystorePassword && keystoreAlias && keystoreKeyPassword


android {
    namespace 'com.mdm.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.mdm.app"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Enable BuildConfig generation
        buildConfigField "boolean", "DEBUG", "true"
        buildConfigField "String", "BUILD_TYPE", "\"debug\""
        buildConfigField "String", "VERSION_NAME", "\"1.0\""
        buildConfigField "int", "VERSION_CODE", "1"

        buildConfigField "String", "MDM_HOST", "\"${mdmHost}\""
        buildConfigField "String", "DEV_SERVER_URL", "\"${mdmDevServer}\""
        buildConfigField "String", "CERT_PIN_PRIMARY", "\"${mdmPinPrimary}\""
        buildConfigField "String", "CERT_PIN_BACKUP", "\"${mdmPinBackup}\""
    }

    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreKeyPassword

                // v2 signing is what Device Owner provisioning checksums against.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "boolean", "DEBUG", "true"
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            buildConfigField "boolean", "DEBUG", "false"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    
    testOptions {
        unitTests {
            // android.util.Log and friends are stubs that throw in JVM unit tests.
            // Returning defaults instead lets pure logic — the policy privilege rules,
            // for instance — be tested without Robolectric or a device.
            returnDefaultValues = true
            all {
                testLogging { events "failed" }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    
    kotlinOptions {
        jvmTarget = '11'
        freeCompilerArgs += [
            '-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi',
            '-opt-in=kotlin.RequiresOptIn'
        ]
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        disable 'MissingPermission'
        abortOnError false
    }

    // Fix for duplicate class definitions
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
    }
}

// A release build without certificate pins would talk to the server over an
// unauthenticated TLS connection while claiming to be pinned — which is exactly what
// shipped before. Fail the build instead of producing that APK.
tasks.matching { it.name.toLowerCase().contains('release') && it.name.startsWith('assemble') }.configureEach {
    doFirst {
        def pinPattern = ~/^sha256\/[A-Za-z0-9+\/]{43}=$/
        def pins = [mdmPinPrimary, mdmPinBackup].findAll { it && pinPattern.matcher(it).matches() }

        if (pins.size() < 2) {
            throw new GradleException(
                "Release builds require two valid certificate pins (primary and a backup for " +
                "rotation). Pass -PmdmPinPrimary=sha256/... and -PmdmPinBackup=sha256/..., or " +
                "set them in gradle.properties. See the comment at the top of app/build.gradle."
            )
        }

        if (!hasSigningConfig) {
            throw new GradleException(
                "Release builds must be signed. An unsigned APK cannot be distributed and " +
                "cannot be provisioned as Device Owner, because the QR payload needs the " +
                "DPC signature checksum. Set mdmStoreFile/mdmStorePassword/mdmKeyAlias/" +
                "mdmKeyPassword, or the MDM_STORE_* environment variables. " +
                "See docs/KEYSTORE_SETUP.md."
            )
        }
    }
}

/**
 * Print the DPC signature checksum for the Device Owner provisioning QR payload.
 *
 * `android.app.extra.PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM` is the URL-safe,
 * unpadded base64 of the SHA-256 of the signing certificate. Getting it by hand is
 * fiddly and easy to get wrong (hex vs base64, standard vs URL-safe alphabet), and a
 * wrong checksum fails provisioning on the device with no useful diagnostic.
 *
 *   ./gradlew printProvisioningChecksum -PmdmStoreFile=... -PmdmStorePassword=... \
 *       -PmdmKeyAlias=... -PmdmKeyPassword=...
 */
/**
 * Screenshot tests run only when asked for.
 *
 * Paparazzi renders real layouts on the JVM, which is how the UI is reviewed at all here
 * — there is no emulator on the build host. But layoutlib cannot inflate every Material
 * component (the status screen's toolbar among them), and it reports those as test
 * failures even when the image renders correctly. Gating every build on that would fail
 * for reasons unrelated to the code.
 *
 * So they are excluded from the normal unit-test run and invoked explicitly:
 *
 *   ./gradlew recordPaparazziDebug   render and save images to app/src/test/snapshots
 *   ./gradlew verifyPaparazziDebug   compare against those images
 */
tasks.withType(Test).configureEach { testTask ->
    def paparazziRun = gradle.startParameter.taskNames.any { it.toLowerCase().contains('paparazzi') }
    if (paparazziRun) {
        // One JVM per class. Paparazzi rules share layoutlib state within a JVM, and a
        // second rule in the same process inflates nothing — the screens after the first
        // rendered as empty grey boxes, which looks like a broken layout and is not one.
        testTask.forkEvery = 1
    } else {
        testTask.filter {
            excludeTestsMatching 'com.mdm.app.ui.*'
            it.failOnNoMatchingTests = false
        }
    }
}

tasks.register('printProvisioningChecksum') {
    description = 'Print the DPC signature checksum for the Device Owner QR payload.'
    group = 'MDM'

    doLast {
        if (!hasSigningConfig) {
            throw new GradleException(
                "Signing configuration required. The checksum is derived from the release " +
                "signing certificate, so an unsigned build has none."
            )
        }

        def ks = java.security.KeyStore.getInstance('PKCS12')
        def resolved = file(keystoreFile)
        if (!resolved.exists()) {
            // Fall back to JKS for older keystores created by keytool's default.
            ks = java.security.KeyStore.getInstance('JKS')
        }

        try {
            resolved.withInputStream { ks.load(it, keystorePassword.toCharArray()) }
        } catch (Exception ignored) {
            ks = java.security.KeyStore.getInstance('JKS')
            resolved.withInputStream { ks.load(it, keystorePassword.toCharArray()) }
        }

        def cert = ks.getCertificate(keystoreAlias)
        if (cert == null) {
            throw new GradleException("No certificate found in keystore for alias '${keystoreAlias}'")
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded)
        def checksum = Base64.urlEncoder.withoutPadding().encodeToString(digest)

        println ""
        println "PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM"
        println "  ${checksum}"
        println ""
        println "Put this in the QR payload as"
        println "  \"android.app.extra.PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM\": \"${checksum}\""
        println ""
    }
}

dependencies {
    // Core Android dependencies
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    
    // Room Database
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    kapt 'androidx.room:room-compiler:2.7.1'
    
    // Security
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // WebSocket
    implementation 'io.socket:socket.io-client:2.1.1'
    
    // JSON Parsing
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.json:json:20231013'
    
    // Work Manager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    
    // Location Services
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    
    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'app.cash.turbine:turbine:1.1.0'
    
    // Android Testing
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'org.mockito:mockito-android:5.18.0'
}