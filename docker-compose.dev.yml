version: '3.8'

services:
  mdm-backend:
    # Built from the repo root: the backend needs the @mdm/shared-types workspace.
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - ./ops/backend.env
    volumes:
      - ./backend:/repo/backend
      - /repo/backend/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  mdm-frontend:
    build: ./admin-dashboard
    ports:
      - "5000:5000"
    environment:
      - VITE_API_URL=http://localhost:5001/api
      - VITE_WS_URL=ws://localhost:5001
      - NODE_ENV=development
    volumes:
      - ./admin-dashboard:/app
      - /app/node_modules
    depends_on:
      - mdm-backend
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=mdm_dev
      - POSTGRES_USER=mdm_user
      - POSTGRES_PASSWORD=mdm_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdm_user -d mdm_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: