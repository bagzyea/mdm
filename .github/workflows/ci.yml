name: CI Pipeline

on:
  push:
    branches: [main, develop, stan]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # Backend linting and type checking
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build check
        run: npm run build

      - name: Run tests
        run: npm test -- --passWithNoTests

  # Frontend build check
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  # Android build validation
  android-build:
    name: Android Build Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: Build Android APK
        working-directory: android-app
        run: ./gradlew assembleDebug

  # Code quality and security checks
  security:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - working-directory: backend
            name: Backend
          - working-directory: admin-dashboard
            name: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (${{ matrix.name }})
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Check for vulnerabilities (${{ matrix.name }})
        working-directory: ${{ matrix.working-directory }}
        continue-on-error: true
        run: npm audit --audit-level=moderate

  # Integration tests (optional, runs after other checks pass)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    if: success()

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mdm_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Setup database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/mdm_test
        run: npx prisma db push --skip-generate

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/mdm_test
        run: npm test -- --testPathPattern="integration" --passWithNoTests

  # Final status check
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build, android-build, security]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.backend-lint.result }}" = "failure" ] || \
             [ "${{ needs.frontend-build.result }}" = "failure" ] || \
             [ "${{ needs.android-build.result }}" = "failure" ] || \
             [ "${{ needs.security.result }}" = "failure" ]; then
            echo "CI Pipeline Failed!"
            exit 1
          fi
          echo "✅ CI Pipeline Passed!"
