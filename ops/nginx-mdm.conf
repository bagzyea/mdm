# TLS for the MDM dashboard and device API at https://ubosmdm.ubos.org.
#
# Tablets may reach their routes from anywhere; the dashboard and sign-in answer only
# on the office network (see the two sections in the 443 server below).
#
# Shares nginx on 10.10.10.241 with AMS (AMS/ops/nginx-ams.conf, which owns the
# default server on 80 and 443). ubosmdm.ubos.org also resolves publicly, to
# 196.0.117.82, which is how tablets in the field reach it.
#
# Install:
#   sudo install -m 644 ops/nginx-mdm.conf /etc/nginx/sites-available/mdm
#   sudo ln -sf /etc/nginx/sites-available/mdm /etc/nginx/sites-enabled/mdm
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate: the Bureau's *.ubos.org wildcard (Sectigo), shared with AMS and installed
# by AMS/ops/install-tls.sh. It must chain to a public CA: release builds of the agent
# trust only the system CA store (android-app/.../network_security_config.xml). If
# certificate pinning is switched on (mdmPinPrimary/mdmPinBackup), pin the Sectigo
# intermediate rather than this key, which changes whenever the wildcard is reissued.
#
# Backend settings that must follow (ops/backend.env):
#   ALLOWED_ORIGINS=https://ubosmdm.ubos.org (keep the old :5002 origins until nothing
#     uses them)
#   PUBLIC_BASE_URL=https://ubosmdm.ubos.org (signed APK download links)
#   API_BASE_URL and WEBSOCKET_URL are what enrolling tablets are told to use; move them
#   to https://ubosmdm.ubos.org only together with an agent release, since debug builds
#   in the field reach http://10.10.10.241:5001 directly.

# Websocket upgrade only when the client asks for one. Set once at server level below:
# a proxy_set_header inside a location drops every one inherited from the server.
map $http_upgrade $mdm_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name ubosmdm.ubos.org;

    # Let's Encrypt HTTP challenge (certbot --webroot -w /var/www/letsencrypt), if
    # port 80 on 196.0.117.82 is forwarded here.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://ubosmdm.ubos.org$request_uri;
    }
}

# :5002 is where the dashboard used to answer, so bookmarks and the AMS sidebar link
# point there. Any name or IP on that port is sent to the HTTPS address.
server {
    listen 5002;
    server_name _;

    return 301 https://ubosmdm.ubos.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ubosmdm.ubos.org;

    ssl_certificate     /etc/ssl/certs/ubos.org-wildcard.crt;
    ssl_certificate_key /etc/ssl/private/ubos.org-wildcard.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # APK uploads to the app vault are the large requests here.
    client_max_body_size 200m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite, not append: the backend trusts this one hop (TRUST_PROXY), so a client
    # cannot plant an address of its choosing in the audit log or rate limits.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $mdm_connection_upgrade;

    # ---- Open to the internet: only what a tablet needs ----------------------------
    # Every route here requires a device token or a signed link. Regex locations are
    # matched before the /api/ prefix below, so these win over the office-only rule.
    location ~ ^/api/devices/(enroll|token/refresh)$ {
        proxy_pass         http://127.0.0.1:5001;
    }
    location ~ ^/api/devices/[^/]+/(heartbeat|commands/pending|policies)$ {
        proxy_pass         http://127.0.0.1:5001;
    }
    location ~ ^/api/commands/[^/]+/result$ {
        proxy_pass         http://127.0.0.1:5001;
    }
    location /downloads/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_read_timeout 300s;
    }
    location = /health {
        proxy_pass         http://127.0.0.1:5001;
    }

    # Live updates, for tablets and dashboards alike (token-authenticated): a websocket
    # that must be upgraded and must not time out when idle.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_buffering    off;
        proxy_read_timeout 1h;
    }

    # ---- Office network only: sign-in, the operator API and the dashboard -----------
    # Sign-in takes UBOS domain passwords, so it is not offered to the internet at all.
    # This only works if nginx sees real client addresses: if the firewall rewrites the
    # source of forwarded traffic (SNAT/masquerade), outside requests arrive from an
    # internal address and pass. Check with IT, or watch /var/log/nginx/access.log.
    location /api/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;

        proxy_pass              http://127.0.0.1:5001;
        proxy_read_timeout      300s;
        proxy_request_buffering off;
    }

    # The dashboard: the Vite server (mdm-dashboard.service), moved to 127.0.0.1:5003 by
    # a systemd drop-in so nginx can own 5002. Serving admin-dashboard/dist directly is
    # the better end state.
    location / {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;

        proxy_pass         http://127.0.0.1:5003;
    }
}
